# ═══════════════════════════════════════════════════════════════════
# render.yaml  — place this in your project ROOT
# ═══════════════════════════════════════════════════════════════════
services:
  - type: web
    name: jobscan-api
    env: node
    region: singapore          # closest to India for lower latency
    plan: starter              # free tier works, starter is more reliable

    # Install system Chrome deps + node packages
    buildCommand: |
      apt-get update && \
      apt-get install -y \
        chromium \
        libatk1.0-0 \
        libatk-bridge2.0-0 \
        libcups2 \
        libdrm2 \
        libxkbcommon0 \
        libxcomposite1 \
        libxdamage1 \
        libxfixes3 \
        libxrandr2 \
        libgbm1 \
        libnss3 \
        libpango-1.0-0 \
        libcairo2 \
        libasound2 \
        fonts-liberation \
      && npm install

    startCommand: node src/server.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
      # Add your other env vars below (from your .env file):
      # - key: MONGO_URI
      #   sync: false
      # - key: JWT_SECRET
      #   sync: false
      # - key: PORT
      #   value: "8000"
